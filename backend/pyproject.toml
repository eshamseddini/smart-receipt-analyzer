[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "ASYNC", "DTZ", "PIE", "RUF", "SIM"]
ignore = [
    "B008",  # function-call-in-default-argument: FastAPI's Depends()/Query() pattern relies on this.
    "RUF001",  # ambiguous-unicode-character-string: French OCR text normalization intentionally handles
    "RUF002",  # ambiguous-unicode-character-docstring:  typographic characters like '’' and accents.
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.black]
line-length = 100
